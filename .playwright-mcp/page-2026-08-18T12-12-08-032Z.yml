          - link [ref=e346] [cursor=pointer]:
            - /url: https://cdn.shopify.com/s/files/1/0998/2620/4936/files/12_51073_howtouse_dahlia.pdf?v=1776867439
      - paragraph [ref=e356]: Dahlia typeface grew from a land filled with elegance, 1910’s Italian lake posters and Art Nouveau feeling. Like so many flowers, it translates a sense of perfect balance between eccentricity and delicacy. It was designed in 2021 by Jérémy Schneider for VJ Type. Dahlia typeface is a display serif typeface, useful for headlines or short to medium-length texts. It comes with 3 weights, regular, medium and bold, and 2 widths, normal and condensed. Dahlia is nonconformist, romantic, delicate and has some extravagant alternates. Its atypical curves and refined details create a lot of rhythm, and timeless elegance. The Bold version uses high contrast to be as noticeable as possible. With a touch of Art Nouveau inspiration, its counter forms are highly expressive, particularly the upper cases P, R, K, B, E. Letters endings and curves are inspired by the flower stems, burgeons and spines. We drew 93 stylistic ligatures, like the vegetal world can naturally combine species. Each letter is designed so that the transition from one letter to the next remains melodious. In this context, all circular glyphs (e,c,o) are included in the Standard ligatures, and enabled by default.
